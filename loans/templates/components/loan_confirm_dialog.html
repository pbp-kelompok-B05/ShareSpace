<dialog id="loan-confirm-dialog" class="loan-confirm-dialog"
        aria-labelledby="loan-confirm-title"
        aria-describedby="loan-confirm-message">

    <div class="loan-confirm-icon" aria-hidden="true">?</div>

    <h2 id="loan-confirm-title">Konfirmasi Tindakan</h2>
    <p id="loan-confirm-message">Yakin ingin melanjutkan?</p>

    <div class="loan-confirm-buttons">
        <button type="button" id="loan-confirm-cancel" class="loan-confirm-button loan-confirm-secondary">
            Batal
        </button>

        <button type="button" id="loan-confirm-accept" class="loan-confirm-button loan-confirm-primary">
            Lanjutkan
        </button>
    </div>
</dialog>
