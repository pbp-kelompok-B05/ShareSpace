{% if location %}
    <div
        class="cod-map-preview"
        data-latitude="{{ location.latitude }}"
        data-longitude="{{ location.longitude }}"
        data-name="{{ location.name }}"
        style="
            width: 100%;
            height: 350px;
            border-radius: 12px;
            overflow: hidden;
        "
    ></div>
{% endif %}
