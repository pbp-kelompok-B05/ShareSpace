<header class="site-header">
    <div class="container header-inner">
        <a class="brand" href="{% url 'landing_page' %}" aria-label="ShareSpace, kembali ke beranda">
            <span class="brand-mark" aria-hidden="true">✳</span>
            <span>share<span class="brand-accent">space</span><span class="brand-dot">.</span></span>
        </a>
        <nav class="main-nav" aria-label="Navigasi utama">
            <a href="{% url 'landing_page' %}#tentang">Tentang</a>
            <a href="{% url 'landing_page' %}#cara-kerja">Cara kerja</a>
            <a href="{% url 'landing_page' %}#manfaat">Manfaat</a>
        </nav>
        <div class="header-actions">
            {# aria-pressed diperbarui theme.js; tombol disembunyikan bila JS mati (lihat .theme-toggle di style.css). #}
            <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false" aria-label="Mode gelap" title="Ganti mode terang/gelap">
                <svg class="theme-icon-moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><path fill="currentColor" d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
                <svg class="theme-icon-sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4.5" fill="currentColor"/><path stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
            <a class="header-cta" href="{% url 'landing_page' %}#cara-kerja">Mulai jelajahi <span aria-hidden="true">↗</span></a>
        </div>
    </div>
</header>
