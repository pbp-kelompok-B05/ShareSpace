<section class="container py-8" id="edit-profile-container">
    <div class="card p-6 max-w-xl mx-auto">
        <h1 class="text-2xl font-bold text-ink mb-6">Edit Profil</h1>

        <form method="post" 
              action="{% url 'authentication:edit_profile' %}" 
              hx-post="{% url 'authentication:edit_profile' %}" 
              hx-target="#konten" 
              hx-swap="innerHTML" 
              hx-push-url="true" 
              novalidate>
            {% csrf_token %}
            
            {% for field in form %}
                <div class="form-group mb-4">
                    <label for="{{ field.id_for_label }}" class="block font-medium mb-1">{{ field.label }}</label>
                    {{ field }}
                    {% if field.help_text %}
                        <p class="text-xs text-muted mt-1">{{ field.help_text }}</p>
                    {% endif %}
                    {% for error in field.errors %}
                        <p class="text-xs text-danger text-red-500 mt-1">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}

            <div class="form-actions flex gap-3 mt-6">
                <button type="submit" class="button button-primary">Simpan Perubahan</button>
                <a href="{% url 'authentication:profile' %}" 
                   hx-get="{% url 'authentication:profile' %}" 
                   hx-target="#konten" 
                   hx-swap="innerHTML" 
                   hx-push-url="true" 
                   class="button button-secondary">
                    Batal
                </a>
            </div>
        </form>
    </div>
</section>
